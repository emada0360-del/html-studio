name: Build HTML Studio
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q project.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build APK
        run: |
          cd htmlstudio
          flutter create --org com.htmlstudio --project-name html_studio --platforms=android .
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          sed -i 's#android:label="[^"]*"#android:label="HTML Studio"#' android/app/src/main/AndroidManifest.xml
          flutter pub get
          find ~/.pub-cache/hosted -path '*/android/build.gradle*' -exec sed -i -E 's/(compileSdk(Version)?[ =]+)[0-9]+/\136/' {} +
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: html-studio-apk
          path: htmlstudio/build/app/outputs/flutter-apk/app-release.apk
